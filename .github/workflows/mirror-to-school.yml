name: Mirror to school

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-school
  cancel-in-progress: false

jobs:
  mirror:
    # Only run on the source repo. The school clone receives this workflow file via mirror;
    # this guard makes it a no-op there instead of a noisy red run on every mirror push.
    if: ${{ github.repository == 'aCuriousDev/dnDiscord-umbrella' && vars.MIRROR_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SCHOOL_SSH_KEY }}

      - name: Trust github.com host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts

      - name: Bare clone of source repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --bare \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            source.git

      - name: Mirror to school
        run: |
          cd source.git
          git remote add school git@github.com:EpitechMscProPromo2026/T-ESP-902-96859-LYO_DnDiscord.git
          git push --mirror school

      - name: Summary
        if: success()
        run: |
          echo "Mirrored ${{ github.repository }}@${{ github.sha }} to EpitechMscProPromo2026/T-ESP-902-96859-LYO_DnDiscord" \
            >> "$GITHUB_STEP_SUMMARY"
